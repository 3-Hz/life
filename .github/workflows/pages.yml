name: Deploy to GitHub Pages

# TypeScript sources compile to dist/ before Pages uploads the site. Pages
# serves it over HTTPS, which is what getDisplayMedia and getUserMedia require.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check sources
        run: bun run typecheck
      - name: Run tests
        run: bun run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build site
        run: bun run build
      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css _site/
          cp -R dist vendor _site/
          test -s _site/dist/main.js
          test -s _site/vendor/three.module.min.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
